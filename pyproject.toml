[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "rfc8-playground"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "napari[all]>=0.8.0",
    "scikit-image>=0.26.0",
    "zarr>=3.3.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pixi.workspace]
channels = ["conda-forge"]
platforms = ["osx-arm64"]

[tool.pixi.pypi-dependencies]
rfc8-playground = { path = ".", editable = true }

[tool.pixi.tasks]

[tool.pixi.dependencies]
openjdk = ">=25.0.2,<26"

[dependency-groups]
dev = [
    "pre-commit>=4.6.2",
]
